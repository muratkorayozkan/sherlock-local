[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-local"
version = "0.1.0"
description = "Sherlock powered local username search with a Turkish browser interface"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sherlock-project==0.16.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "httpx2>=2.16,<3; python_version >= '3.11'"]

[tool.setuptools.packages.find]
include = ["sherlock_local*"]

[tool.setuptools.package-data]
sherlock_local = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
